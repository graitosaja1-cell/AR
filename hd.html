/* ============================================================
   STORAGE — IndexedDB, ikut Backup / Sync aplikasi induk
   DB     : hd-hutang-dagang-db  (store "data", key "latest")
   Format : { v:1, months:[...], rows:[{bulan,jenis,tgl,supplier,nominal,ket}], savedAt }
   Nama DB, store & channel HARUS sama dengan daftar DBS di Backup/Sync (index.html).
   ============================================================ */
const STORAGE_KEY  = "hutangDagangData_v4";        // format lama (localStorage): hanya dibaca untuk migrasi
const MIGRATED_KEY = "hutangDagangIdbMigrated";
const IDB_NAME = "hd-hutang-dagang-db", IDB_STORE = "data", IDB_KEY = "latest";
const SYNC_CHANNEL = "hd-hutang-sync";

function migrateRow(r){
  const isOld = typeof r[3] === "number" && typeof r[2] !== "number";
  if (isOld) return [r[0], r[1], Number(r[3])||0, ""];
  return [r[0], r[1], Number(r[2])||0, String(r[3]||"")];
}
function migrateData(d){
  ["sudahDibayar","belumDibayar"].forEach(k => {
    if (Array.isArray(d[k])) d[k] = d[k].map(migrateRow);
  });
  return d;
}

/* ---- IndexedDB ---- */
function idbOpen(){
  return new Promise((ok, no) => {
    if (!("indexedDB" in window)) { no(new Error("IndexedDB tidak tersedia")); return; }
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE);
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
    r.onblocked = () => no(new Error("IndexedDB terblokir"));
  });
}
async function idbGet(){
  const db = await idbOpen();
  return new Promise((ok, no) => {
    const q = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(IDB_KEY);
    q.onsuccess = () => { db.close(); ok(q.result); };
    q.onerror   = () => { db.close(); no(q.error); };
  });
}
async function idbPut(v){
  const db = await idbOpen();
  return new Promise((ok, no) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(v, IDB_KEY);
    tx.oncomplete = () => { db.close(); ok(); };
    tx.onerror = tx.onabort = () => { db.close(); no(tx.error); };
  });
}

/* ---- data <-> payload ---- */
function toPayload(){
  const months = Object.keys(data), rows = [];
  months.forEach(b => {
    const d = data[b] || {};
    [["sudah", d.sudahDibayar], ["belum", d.belumDibayar]].forEach(([jenis, arr]) => {
      (arr || []).forEach(r => {
        if (!r[0] && !r[1] && !Number(r[2]) && !r[3]) return;      // baris kosong tidak disimpan
        rows.push({ bulan:b, jenis, tgl:r[0]||"", supplier:r[1]||"", nominal:Number(r[2])||0, ket:r[3]||"" });
      });
    });
  });
  return { v:1, months, rows, savedAt:Date.now() };
}
function fromPayload(p){
  const out = {};
  (p.months || []).forEach(b => { out[b] = { sudahDibayar: [], belumDibayar: [] }; });
  (p.rows || []).forEach(x => {
    if (!out[x.bulan]) out[x.bulan] = { sudahDibayar: [], belumDibayar: [] };
    (x.jenis === "belum" ? out[x.bulan].belumDibayar : out[x.bulan].sudahDibayar)
      .push([x.tgl||"", x.supplier||"", Number(x.nominal)||0, String(x.ket||"")]);
  });
  return out;
}

/* ---- baca data lama dari localStorage (hanya untuk migrasi satu kali) ---- */
function readLegacy(){
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
    const old = localStorage.getItem("hutangDagangData_v3")
             || localStorage.getItem("hutangDagangData_v2")
             || localStorage.getItem("hutangDagangData_v1");
    if (old) {
      const parsed = JSON.parse(old);
      Object.keys(parsed).forEach(b => migrateData(parsed[b]));
      return parsed;
    }
  } catch(e){}
  return null;
}

let _idbBroken = false;
async function loadData(){
  let rec = null;
  try { rec = await idbGet(); } catch(e){ _idbBroken = true; console.warn("[hd] IndexedDB gagal:", e); }
  if (rec && Array.isArray(rec.rows)) return { data: fromPayload(rec), migrate: false };   // sumber utama

  let migrated = false;
  try { migrated = localStorage.getItem(MIGRATED_KEY) === "1"; } catch(e){}
  if (_idbBroken || !migrated) {
    const legacy = readLegacy();
    if (legacy) return { data: legacy, migrate: !_idbBroken };
  }
  return { data: JSON.parse(JSON.stringify(DEFAULT_DATA)), migrate: false };   // belum disimpan sampai ada perubahan
}

/* ---- simpan (debounce, berurutan) + beritahu Backup/Sync ---- */
let _bc = null;
function notifySync(){
  try {
    if (!_bc && "BroadcastChannel" in window) _bc = new BroadcastChannel(SYNC_CHANNEL);
    if (_bc) _bc.postMessage({ type: "data-changed" });
  } catch(e){}
}
let _saveT = null, _dirty = false, _chain = Promise.resolve(true), _warned = false;
function persist(){
  _dirty = true;
  clearTimeout(_saveT);
  _saveT = setTimeout(flush, 250);
}
function flush(){
  clearTimeout(_saveT);
  _chain = _chain.then(async () => {
    if (!_dirty) return true;
    _dirty = false;
    if (!_idbBroken) {
      try { await idbPut(toPayload()); notifySync(); return true; }
      catch(e){ console.warn("[hd] simpan IndexedDB gagal:", e); _idbBroken = true; }
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
    if (!_warned) { _warned = true; toast("⚠️ Penyimpanan browser bermasalah — data HD belum ikut Backup/Sync", true); }
    return false;
  });
  return _chain;
}
window.addEventListener("pagehide", () => { flush(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

const NAMA_BULAN = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI",
                    "JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
/* Pastikan 12 bulan selalu tersedia, urut kalender; bulan buatan sendiri (Tambah Bulan) tetap ada di belakang */
function ensureMonths(d){
  const out = {};
  NAMA_BULAN.forEach(b => { out[b] = d[b] || { sudahDibayar: [], belumDibayar: [] }; });
  Object.keys(d).forEach(b => { if (!out[b]) out[b] = d[b]; });
  return out;
}

function getDefaultBulan(){
  const cur = NAMA_BULAN[new Date().getMonth()];
  if (data[cur]) return cur;
  const keys = Object.keys(data);
  for (let i = keys.length - 1; i >= 0; i--) {
    const d = data[keys[i]];
    if (d.sudahDibayar.length || d.belumDibayar.length) return keys[i];
  }
  return keys[0];
}

/* ============================================================
   UTIL
   ============================================================ */
const BULAN_ID = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const rupiah = n => "Rp " + (Number(n)||0).toLocaleString("id-ID");

function formatRibuan(n){
  if (n === "" || n === null || n === undefined) return "";
  const num = Number(n);
  if (!num) return "";
  return num.toLocaleString("id-ID");
}
function parseRibuan(s){
  const digits = String(s||"").replace(/[^\d]/g, "");
  return digits ? parseInt(digits, 10) : 0;
}
function fmtDate(s){
  if (!s) return "-";
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s;
  return `${parseInt(m[3])} ${BULAN_ID[parseInt(m[2])-1]} ${m[1]}`;
}
function toISO(v){
  if (!v) return "";
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  }
  if (typeof v === "number") {
    try {
      const d = XLSX.SSF.parse_date_code(v);
      return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
    } catch(e){ return String(v); }
  }
  const s = String(v).trim();
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (dmy) {
    let y = dmy[3]; if (y.length === 2) y = "20"+y;
    return `${y}-${dmy[2].padStart(2,"0")}-${dmy[1].padStart(2,"0")}`;
  }
  const dt = new Date(s);
  if (!isNaN(dt)) return toISO(dt);
  return s;
}
function toNum(v){
  if (typeof v === "number") return v;
  if (!v) return 0;
  return parseRibuan(v);
}
function escapeAttr(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;")
                      .replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function toast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(t._to);
  t._to = setTimeout(() => { t.className = "toast"; }, 2400);
}
function hitungTotal(arr){
  return arr.reduce((s,r)=> s + (Number(r[2])||0), 0);
}

   EVENT PANEL
   ============================================================ */
const panelEl = document.getElementById("panel");

panelEl.addEventListener("input", e => {
  const inp = e.target;
  if (!inp.classList.contains("cell-input")) return;
  const mode = inp.dataset.mode;
  const idx  = parseInt(inp.dataset.idx);
  const field = parseInt(inp.dataset.field);
  const arr  = mode === "sudah" ? data[currentBulan].sudahDibayar
                                : data[currentBulan].belumDibayar;
  if (!arr[idx]) return;

  if (field === 2) {
    const angka = parseRibuan(inp.value);
    arr[idx][2] = angka;
    inp.value = angka ? angka.toLocaleString("id-ID") : "";
    persist();
    updateTotalsLive();
    return;
  }

  arr[idx][field] = inp.value;
  persist();
});

panelEl.addEventListener("click", e => {
  if (e.target.closest("#btnTambah")) {
    tambahBarisBelum();
    return;
  }
  const btnPindah = e.target.closest(".btn-pindah");
  if (btnPindah) {
    pindahKeSudah(parseInt(btnPindah.dataset.idx));
    return;
  }
  const btnHapus = e.target.closest(".btn-hapus");
  if (btnHapus) {
    const mode = btnHapus.dataset.mode;
    const idx = parseInt(btnHapus.dataset.idx);
    if (mode === "sudah") hapusBarisSudah(idx);
    else hapusBarisBelum(idx);
    return;
  }
});

panelEl.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const inp = e.target;
  if (!inp.classList.contains("cell-input")) return;
  if (inp.dataset.mode === "belum" && inp.dataset.field === "3") {
    e.preventDefault();
    tambahBarisBelum();
  }
});

function updateTotalsLive(){
  const d = data[currentBulan];
  const tB = hitungTotal(d.belumDibayar);
  const tS = hitungTotal(d.sudahDibayar);
  const elB = document.getElementById("totalBelum");
  const elSB = document.getElementById("sumBelum");
  const elGT = document.getElementById("grandTotal");
  if (elB) elB.textContent = rupiah(tB);
  if (elSB) elSB.textContent = rupiah(tB);
  if (elGT) elGT.textContent = rupiah(tS + tB);
}

function hapusBarisSudah(idx){
  const d = data[currentBulan];
  const row = d.sudahDibayar[idx];
  if (!row) return;
  const label = row[1] || "(tanpa supplier)";
  const nominal = rupiah(row[2]);
  if (!confirm(`Hapus baris SUDah dibayar:\n\n"${label}" — ${nominal}\n\nLanjutkan?`)) return;
  d.sudahDibayar.splice(idx, 1);
  persist();
  render();
  toast(`🗑 Baris "${label}" dihapus`);
}

function hapusBarisBelum(idx){
  const d = data[currentBulan];
  const row = d.belumDibayar[idx];
  if (!row) return;
  const label = row[1] || "(tanpa supplier)";
  const nominal = rupiah(row[2]);
  if (!confirm(`Hapus baris BELUM dibayar:\n\n"${label}" — ${nominal}\n\nLanjutkan?`)) return;
  d.belumDibayar.splice(idx, 1);
  persist();
  render();
  toast(`🗑 Baris "${label}" dihapus`);
}

function tambahBarisBelum(){
  const arr = data[currentBulan].belumDibayar;
  const last = arr[arr.length - 1];
  if (last && !last[0] && !last[1] && !last[2] && !last[3]) {
    const inputs = document.querySelectorAll('#tblBelum input[data-idx="'+(arr.length-1)+'"]');
    if (inputs[0]) inputs[0].focus();
    return;
  }
  arr.push(["", "", 0, ""]);
  persist();
  render();

  setTimeout(() => {
    const idx = arr.length - 1;
    const first = document.querySelector('#tblBelum input[data-idx="'+idx+'"][data-field="0"]');
    if (first) first.focus();
  }, 30);
}

function pindahKeSudah(idx){
  const d = data[currentBulan];
  const row = d.belumDibayar[idx];
  if (!row) return;

  if (!row[1] || !row[2]) {
    toast("Isi dulu Supplier & Nominal sebelum dipindahkan.", true);
    return;
  }

  const tglBayar = prompt(
    `Tanggal bayar untuk "${row[1]}" (YYYY-MM-DD):`,
    toISO(new Date())
  );
  if (tglBayar === null) return;
  const iso = toISO(tglBayar);
  if (!iso) { toast("Tanggal tidak valid.", true); return; }

  d.belumDibayar.splice(idx, 1);
  d.sudahDibayar.push([iso, row[1], row[2], row[3] || ""]);

  persist();
  render();
  toast(`✅ "${row[1]}" dipindahkan ke Sudah Dibayar`);
}

function rowCount(b){
  const d = data[b] || {};
  const ok = r => r[1] || r[2];
  return (d.sudahDibayar||[]).filter(ok).length + (d.belumDibayar||[]).filter(ok).length;
}
const mdEl = id => document.getElementById(id);
let _mdDone = null;
function closePick(v){
  mdEl("mdOv").classList.remove("show");
  const f = _mdDone; _mdDone = null; if (f) f(v);
}
/* opts: {title, hint, multi, okLabel, danger, needData, note(b)} -> Promise<string[]|null> */
function pickMonths(opts){
  return new Promise(res => {
    if (_mdDone) _mdDone(null);
    _mdDone = res;
    const keys = Object.keys(data);
    mdEl("mdTitle").textContent = opts.title;
    mdEl("mdHint").textContent = opts.hint || "";
    const okBtn = mdEl("mdOk");
    okBtn.textContent = opts.okLabel || "OK";
    okBtn.className = "md-ok" + (opts.danger ? " danger" : "");
    mdEl("mdAllRow").style.display = opts.multi ? "flex" : "none";
    mdEl("mdAll").checked = false;
    const list = mdEl("mdList");
    list.innerHTML = keys.map(b => {
      const n = rowCount(b), off = opts.needData && !n;
      const on = !off && b === currentBulan;
      const note = off ? "kosong" : (opts.note ? opts.note(b, n) : n + " baris");
      return `<label class="md-item${on ? " on" : ""}${off ? " off" : ""}">
        <input type="${opts.multi ? "checkbox" : "radio"}" name="mdPick" value="${escapeAttr(b)}"${on ? " checked" : ""}${off ? " disabled" : ""}>
        <span class="lbl">${b}</span><span class="cnt">${note}</span></label>`;
    }).join("");
    const sync = () => {
      const picked = [...list.querySelectorAll("input:checked")];
      list.querySelectorAll(".md-item").forEach(l => l.classList.toggle("on", !!l.querySelector("input:checked")));
      okBtn.disabled = !picked.length;
      if (opts.multi) {
        const en = [...list.querySelectorAll("input:not(:disabled)")];
        mdEl("mdAll").checked = en.length > 0 && en.every(i => i.checked);
      }
    };
    list.onchange = sync;
    mdEl("mdAll").onchange = e => {
      list.querySelectorAll("input:not(:disabled)").forEach(i => { i.checked = e.target.checked; });
      sync();
    };
    okBtn.onclick = () => closePick([...list.querySelectorAll("input:checked")].map(i => i.value));
    sync();
    mdEl("mdOv").classList.add("show");
  });
}
mdEl("mdX").onclick = mdEl("mdCancel").onclick = () => closePick(null);
mdEl("mdOv").addEventListener("click", e => { if (e.target.id === "mdOv") closePick(null); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && mdEl("mdOv").classList.contains("show")) closePick(null); });

   UPLOAD EXCEL (pilih 1 bulan tujuan)
   ============================================================ */
let uploadTarget = "";
document.getElementById("btnUpload").onclick = async () => {
  const pick = await pickMonths({
    title: "📤 Upload Excel ke bulan…", multi: false, okLabel: "Pilih File…",
    hint: "Pilih bulan tujuan. Data bulan tersebut akan DIGANTI isi file Excel.",
    note: (b, n) => n ? n + " baris (diganti)" : "kosong"
  });
  if (!pick || !pick.length) return;
  uploadTarget = pick[0];
  document.getElementById("fileInput").click();
};

document.getElementById("fileInput").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const target = uploadTarget || currentBulan;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, { type:"binary", cellDates:true });
      const parsed = parseWorkbook(wb);
      if (!parsed.sudahDibayar.length && !parsed.belumDibayar.length) {
        toast("Tidak ada data yang bisa dibaca.", true); return;
      }
      data[target] = parsed;
      currentBulan = target;
      persist(); refreshDropdown(); render();
      toast(`✅ Upload ke ${target} (${parsed.sudahDibayar.length + parsed.belumDibayar.length} baris)`);
    } catch (err) {
      console.error(err);
      toast("Gagal baca file: " + err.message, true);
    }
  };
  reader.readAsBinaryString(file);
  e.target.value = "";
};

function parseWorkbook(wb){
  const sudahDibayar = [], belumDibayar = [];
  wb.SheetNames.forEach(sheetName => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName],
                  { header:1, raw:true, defval:"" });
    let mode = null;
    for (const row of rows) {
      const c0 = String(row[0]??"").toUpperCase().trim();
      const joined = (c0 + " " + String(row[1]??"")).toUpperCase();

      if (joined.includes("TGL BAYAR"))   { mode = "sudah"; continue; }
      if (joined.includes("TGL INVOICE")) { mode = "belum"; continue; }
      if (c0.startsWith("TOTAL"))         { mode = null; continue; }
      if (joined.includes("HUTANG DAGANG") || joined.includes("HUTANG DAGANY") ||
          joined.includes("LAPORAN HUTANG")) { mode = null; continue; }

      if (!mode) continue;

      const sup = String(row[1]??"").trim();
      const v2 = row[2], v3 = row[3];
      let nom, ket;
      if (typeof v3 === "number" && (typeof v2 !== "number")) {
        nom = toNum(v3); ket = "";
      } else {
        nom = toNum(v2); ket = String(v3??"").trim();
      }
      if (!sup || !nom) continue;

      (mode === "sudah" ? sudahDibayar : belumDibayar)
        .push([toISO(row[0]), sup, nom, ket]);
    }
  });
  return { sudahDibayar, belumDibayar };
}

/* ============================================================
   SIMPAN EXCEL (boleh pilih beberapa bulan -> 1 sheet per bulan)
   ============================================================ */
function isoToDate(s){
  const m = String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s || "";
  return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));   // UTC agar tanggal tidak geser karena zona waktu
}
function sheetBulan(wb, bulan){
  const d = data[bulan] || {};
  const sudah = (d.sudahDibayar||[]).filter(r => r[1] || r[2]);
  const belum = (d.belumDibayar||[]).filter(r => r[1] || r[2]);
  if (!sudah.length && !belum.length) return null;

  const ws = wb.addWorksheet(bulan.slice(0,31), {
    views: [{ showGridLines: false }],
    pageSetup: {
      paperSize: 9, orientation: "portrait",            // A4 portrait
      fitToPage: true, fitToWidth: 1, fitToHeight: 0,   // lebar pas 1 halaman, tinggi bebas
      horizontalCentered: true,
      margins: { left: 0.5, right: 0.5, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 }
    },
    headerFooter: {
      oddFooter: "&L&8Dicetak: &D&R&8Halaman &P dari &N"
    }
  });
  ws.columns = [{ width: 14 }, { width: 36 }, { width: 18 }, { width: 32 }];

  const NAVY = "FF1F3B73", GRAY = "FFD0D5DD", YEL = "FFFFF2CC";
  const thin = { style: "thin", color: { argb: GRAY } };
  const border = { top: thin, bottom: thin, left: thin, right: thin };
  const FONT = "Calibri";

  const title = (text, size) => {
    const r = ws.addRow([text]);
    ws.mergeCells(r.number, 1, r.number, 4);
    r.getCell(1).font = { name: FONT, bold: true, size: size };
    r.getCell(1).alignment = { horizontal: "left", vertical: "middle" };
    return r;
  };
  const header = (labels) => {
    const r = ws.addRow(labels);
    r.height = 20;
    r.eachCell(c => {
      c.font = { name: FONT, bold: true, size: 11, color: { argb: "FFFFFFFF" } };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: NAVY } };
      c.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
      c.border = border;
    });
    return r;
  };
  const section = (rows, totalLabel) => {
    rows.forEach(x => {
      const r = ws.addRow([isoToDate(x[0]), x[1], Number(x[2]) || 0, x[3] || ""]);
      const c1 = r.getCell(1), c2 = r.getCell(2), c3 = r.getCell(3), c4 = r.getCell(4);
      c1.numFmt = "dd/mm/yy"; c1.alignment = { horizontal: "center", vertical: "top" };
      c2.alignment = { horizontal: "left", vertical: "top", wrapText: true };
      c3.numFmt = "#,##0";    c3.alignment = { horizontal: "right", vertical: "top" };
      c4.alignment = { horizontal: "left", vertical: "top", wrapText: true };
      [c1,c2,c3,c4].forEach(c => { c.font = { name: FONT, size: 11 }; c.border = border; });
    });
    const t = ws.addRow(["TOTAL", "", hitungTotal(rows), ""]);
    ws.mergeCells(t.number, 1, t.number, 2);
    t.eachCell({ includeEmpty: true }, (c, n) => {
      if (n > 4) return;
      c.font = { name: FONT, bold: true, size: 11 };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: YEL } };
      c.border = border;
    });
    t.getCell(1).alignment = { horizontal: "left", vertical: "middle" };
    t.getCell(3).numFmt = "#,##0";
    t.getCell(3).alignment = { horizontal: "right", vertical: "middle" };
  };

  title("LAPORAN HUTANG DAGANG KE SUPPLYER", 14);
  ws.addRow([]);
  title(bulan, 12);
  ws.addRow([]);
  const lastTitleRow = ws.rowCount;                       // baris 1-4 diulang di tiap halaman cetak

  title("HUTANG DAGANG YG SUDAH DI BAYAR", 11);
  ws.addRow([]);
  header(["TGL BAYAR", "SUPPLYER", "NOMINAL BAYAR", "KETERANGAN"]);
  section(sudah);
  ws.addRow([]); ws.addRow([]);

  title("HUTANG DAGANG YG BELUM DI BAYAR", 11);
  ws.addRow([]);
  header(["TGL INVOICE", "SUPPLYER", "NOMINAL", "KETERANGAN"]);
  section(belum);

  ws.pageSetup.printTitlesRow = "1:" + lastTitleRow;
  ws.pageSetup.printArea = "A1:D" + ws.rowCount;
  return ws;
}
document.getElementById("btnSave").onclick = async () => {
  if (!Object.keys(data).some(b => rowCount(b))) { toast("Tidak ada data untuk disimpan.", true); return; }
  if (typeof ExcelJS === "undefined") { toast("Library Excel belum termuat (cek koneksi internet).", true); return; }
  const pick = await pickMonths({
    title: "💾 Simpan Excel — pilih bulan", multi: true, needData: true, okLabel: "Simpan",
    hint: "Centang satu atau beberapa bulan. Tiap bulan jadi satu sheet dalam satu file."
  });
  if (!pick || !pick.length) return;
  const wb = new ExcelJS.Workbook();
  const done = [];
  pick.forEach(b => { if (sheetBulan(wb, b)) done.push(b); });
  if (!done.length) { toast("Tidak ada data untuk disimpan.", true); return; }
  const fname = done.length === 1 ? `Hutang_Dagang_${done[0]}.xlsx` : `Hutang_Dagang_${done.length}_bulan.xlsx`;
  try {
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`💾 File ${fname} dibuat`);
  } catch (err) {
    console.error(err);
    toast("Gagal membuat file: " + err.message, true);
  }
};

/* ============================================================
   HAPUS DATA (boleh pilih beberapa bulan)
   ============================================================ */
document.getElementById("btnDelete").onclick = async () => {
  if (!Object.keys(data).some(b => rowCount(b))) { toast("Semua bulan sudah kosong.", true); return; }
  const pick = await pickMonths({
    title: "🗑️ Hapus Data — pilih bulan", multi: true, needData: true, danger: true, okLabel: "Hapus Terpilih",
    hint: "Centang bulan yang datanya ingin dihapus. Bulan lain tidak terpengaruh."
  });
  if (!pick || !pick.length) return;
  const total = pick.reduce((s, b) => s + rowCount(b), 0);
  if (!confirm(`Hapus SEMUA data ${pick.length} bulan (${total} baris)?\n\n${pick.join(", ")}\n\nTidak bisa dibatalkan.`)) return;
  pick.forEach(b => { data[b] = { sudahDibayar: [], belumDibayar: [] }; });
  persist(); render();
  toast(`🗑️ Data ${pick.length === 1 ? pick[0] : pick.length + " bulan"} dihapus`);
};

/* ============================================================
   TAMBAH BULAN
   ============================================================ */
document.getElementById("btnAddMonth").onclick = () => {
  const nama = prompt("Nama bulan baru (contoh: NOVEMBER):");
  if (!nama) return;
  const key = nama.trim().toUpperCase();
  if (!key) return;
  if (data[key]) { toast("Bulan sudah ada.", true); return; }
  data[key] = { sudahDibayar: [], belumDibayar: [] };
  currentBulan = key;
  persist(); refreshDropdown(); render();
  toast(`Bulan ${key} ditambahkan`);
};

/* ============================================================
   GANTI BULAN
   ============================================================ */
document.getElementById("bulanSel").onchange = e => {
  currentBulan = e.target.value;
  render();
};

/* INIT — muat dari IndexedDB (atau migrasi dari localStorage lama), lalu tampilkan */
(async function init(){
  const box = document.querySelector(".container");
  box.classList.add("loading");
  const r = await loadData();
  data = r.data;
  Object.keys(data).forEach(b => migrateData(data[b]));
  data = ensureMonths(data);                         // Januari–Desember selalu ada (kosong bila belum diisi)
  currentBulan = getDefaultBulan();
  refreshDropdown();
  render();
  box.classList.remove("loading");
  if (r.migrate) {                                   // data lama dipindah ke IndexedDB agar ikut Backup/Sync
    _dirty = true;
    if (await flush()) { try { localStorage.setItem(MIGRATED_KEY, "1"); } catch(e){} }
  }
})();
